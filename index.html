
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V.P.S. ELEKTRO | Výuková hra</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: linear-gradient(135deg, #101d18, #244633);
            color: white;
        }

        .welcome-container {
            width: 100%;
            max-width: 800px;
            padding: 60px 45px;
            text-align: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .game-label {
            color: #a8d8b7;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .company-name {
            font-size: clamp(34px, 6vw, 55px);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .company-name span {
            color: #8bdba5;
        }

        .divider {
            width: 90px;
            height: 3px;
            margin: 0 auto 35px;
            background: #8bdba5;
            border-radius: 5px;
        }

        h1 {
            font-size: clamp(23px, 4vw, 32px);
            line-height: 1.4;
            margin-bottom: 28px;
        }

        .welcome-text {
            max-width: 620px;
            margin: 0 auto;
            color: #dce9df;
            font-size: 19px;
            line-height: 1.9;
        }

        .start-button {
            display: inline-block;
            margin-top: 45px;
            padding: 16px 55px;
            border: none;
            border-radius: 8px;
            background: #8bdba5;
            color: #10291b;
            font-family: inherit;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .start-button:hover {
            background: #b3f2c5;
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 45px;
            color: #9ab4a3;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .welcome-container {
                padding: 40px 22px;
            }

            .welcome-text {
                font-size: 16px;
            }

            .start-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="welcome-container">

        <p class="game-label">
            Interaktivní výuková hra
        </p>

        <div class="company-name">
            V.P.S. <span>ELEKTRO</span>
        </div>

        <div class="divider"></div>

        <h1>
            Vítáme Vás ve společnosti<br>
            V.P.S. ELEKTRO s.r.o.
        </h1>

        <p class="welcome-text">
            Nyní se seznámíte s procesem osazování
            desek plošných spojů.
            <br><br>
            Postupujte podle pokynů ve hře.
            Pokud něco nevíte, zeptejte se technologa,
            rád Vám pomůže.
        </p>

        <button class="start-button" onclick="startGame()">
            Začít hru &rarr;
        </button>

        <p class="footer">
            V.P.S. ELEKTRO s.r.o. | Výukový program
        </p>

    </main>

    <script>
        function startGame() {
            window.location.href = "seznameni.html";
        }
    </script>

</body>
</html>
